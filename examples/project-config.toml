# Minimal project configuration. These selectors preserve the default checks.
[checks]
select = ["ALL"]
ignore = []

# Ignore unfinished text markers:
# ignore = ["TEX001"]

# Limit selectable checks to source and bibliography families:
# select = ["TEX", "BIB"]

# Selection filters configured checks. It does not enable networking or edits,
# supply thresholds, or bypass required build/archive verification.
