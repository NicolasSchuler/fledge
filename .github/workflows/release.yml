name: Release

# Publishing a GitHub release builds the package and uploads it to PyPI as
# `fledge-latex`. A manual run builds and smoke-tests the same files but never
# publishes. Maintainer set-up and release steps: docs/development.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One release at a time; never cancel an upload that has started.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # Fail before building when the project metadata, the module and the
      # release tag disagree about the version, or the distribution is misnamed.
      - name: Verify the release tag matches the package version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          init = Path("src/latexprep/__init__.py").read_text(encoding="utf-8")
          found = re.search(r'^__version__ = "([^"]+)"', init, re.MULTILINE)
          problems = []
          if project["name"] != "fledge-latex":
              problems.append(f"pyproject.toml names the distribution {project['name']!r}, not 'fledge-latex'")
          version = project["version"]
          if found is None or found.group(1) != version:
              module = found.group(1) if found else "missing"
              problems.append(
                  f"pyproject.toml version {version} differs from latexprep.__version__ ({module}); "
                  "`fledge --version` would report the wrong version"
              )
          tag = os.environ.get("RELEASE_TAG", "")
          if tag and tag != f"v{version}":
              problems.append(f"release tag {tag!r} does not match pyproject.toml version {version} (expected 'v{version}')")
          if not tag:
              print("No release tag (manual run): checked the package metadata only.")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"Version {version} is consistent.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          PY
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check 'build>=1.2,<2' 'twine>=6,<7'
      - name: Build source distribution and wheel
        run: python -m build --outdir dist
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      # Install the wheel, not the checkout, into a fresh environment and run it
      # from another directory, so a file missing from the wheel cannot be hidden
      # by the source tree.
      - name: Smoke-test the built wheel in a fresh environment
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          venv="$RUNNER_TEMP/wheel-smoke"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check "${wheels[0]}"
          presets="$GITHUB_WORKSPACE/src/latexprep/presets"
          cd "$RUNNER_TEMP"
          for command in fledge latex-prep; do
            printed=$("$venv/bin/$command" --version)
            if [ "$printed" != "fledge, version $EXPECTED_VERSION" ]; then
              echo "::error::$command --version printed '$printed', expected version $EXPECTED_VERSION"
              exit 1
            fi
          done
          "$venv/bin/fledge" --help > /dev/null
          "$venv/bin/python" -I - "$EXPECTED_VERSION" "$presets" <<'PY'
          import sys
          from importlib import metadata, resources
          from pathlib import Path

          import latexprep

          expected_version, source_presets = sys.argv[1], Path(sys.argv[2])
          distribution = metadata.distribution("fledge-latex")
          if distribution.version != expected_version:
              sys.exit(f"Installed version {distribution.version} is not {expected_version}")
          if "site-packages" not in Path(latexprep.__file__).parts:
              sys.exit(f"latexprep was imported from {latexprep.__file__}, not the installed wheel")
          source = sorted(path.name for path in source_presets.glob("*.toml"))
          shipped = sorted(
              entry.name
              for entry in (resources.files("latexprep") / "presets").iterdir()
              if entry.name.endswith(".toml")
          )
          if not source or shipped != source:
              sys.exit(f"latexprep/presets/*.toml in the wheel {shipped} differ from the source {source}")
          print(f"fledge-latex {distribution.version} ships presets: {', '.join(shipped)}")
          PY
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    # Only a published release uploads; manual runs stop after the build job.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `pypi` environment must exist in the repository settings and match the
    # trusted publisher registered on PyPI. id-token is granted to this job only.
    environment:
      name: pypi
      url: https://pypi.org/project/fledge-latex/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
