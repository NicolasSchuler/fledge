name: Release

# Publishing a GitHub release builds the package and uploads it to PyPI as
# `fledge-latex`. A manual run builds and smoke-tests the same files but never
# publishes. Maintainer set-up and release steps: docs/development.md.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

# One release at a time; never cancel an upload that has started.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # Fail before building when the project metadata, the module and the
      # release tag disagree about the version, or the distribution is misnamed.
      - name: Verify the release tag matches the package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/release_checks.py version --tag "$RELEASE_TAG"
      - name: Install build tools
        run: python -m pip install --disable-pip-version-check 'build>=1.2,<2' 'twine>=6,<7'
      - name: Build source distribution and wheel
        run: python -m build --outdir dist
      - name: Check package metadata
        run: python -m twine check --strict dist/*
      # Install the wheel, not the checkout, into a fresh environment and run it
      # from another directory, so a file missing from the wheel cannot be hidden
      # by the source tree.
      - name: Smoke-test the built wheel in a fresh environment
        run: python scripts/release_checks.py wheel dist
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    # Only a published release uploads; manual runs stop after the build job.
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `pypi` environment must exist in the repository settings and match the
    # trusted publisher registered on PyPI. id-token is granted to this job only.
    environment:
      name: pypi
      url: https://pypi.org/project/fledge-latex/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
