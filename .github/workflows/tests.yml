name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so live TeX and sandbox tests notice upstream drift between pushes.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The reproducible gate; the compatibility matrix below still resolves dependencies afresh.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Sync the locked development and documentation extras
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --locked --python 3.13 --extra dev --extra docs
      - name: Lint
        run: uv run --no-sync ruff check src tests docs/conf.py scripts
      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests docs/conf.py scripts
      # These shared test modules supply doubles for the package's adapters.
      - name: Check types
        run: >-
          uv run --no-sync ty check src/latexprep tests/support.py tests/fakes.py
          tests/pdf_fakes.py tests/live_support.py tests/page_render_fakes.py
          tests/online_support.py tests/module_layers.py
      # Run the same strict Sphinx build as Deploy documentation, without publishing.
      - name: Build documentation with warnings as errors
        run: >-
          uv run --no-sync python -m sphinx -n -W --keep-going -b html
          -d "$RUNNER_TEMP/sphinx-doctrees" docs "$RUNNER_TEMP/docs-html"
      # pyproject.toml sets branch and subprocess coverage and the fail_under gate.
      - name: Run unit tests with the coverage gate
        id: coverage
        run: uv run --no-sync python -m pytest tests -m 'not live' -n auto -ra -p no:cacheprovider --cov
      - name: Show the coverage report in the job summary
        if: ${{ !cancelled() && (steps.coverage.outcome == 'success' || steps.coverage.outcome == 'failure') }}
        run: >-
          uv run --no-sync python -m coverage report --format=markdown
          --fail-under=0 >> "$GITHUB_STEP_SUMMARY"

  # Shell scripts are linted here because the installer is the one shell program shipped.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # shellcheck is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Lint install.sh
        run: |
          shellcheck --version
          shellcheck install.sh

  # Build what would be published and use it the way a user would: install the wheel
  # into a fresh environment and run it from another directory, then run the
  # documentation and packaging tests from the extracted source archive, which must carry
  # every file they read (scripts, skills, examples, docs and the changelog).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check the package metadata and version
        run: python scripts/release_checks.py version
      - name: Build source distribution and wheel
        run: |
          python -m pip install --disable-pip-version-check 'build>=1.2,<2' 'twine>=6,<7'
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Install the wheel in a fresh environment and run fledge on the offline example
        run: python scripts/release_checks.py wheel dist
      - name: Run the documentation and packaging tests from the source distribution
        run: python scripts/release_checks.py sdist dist

  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      # Real tool and sandbox checks run separately from this floating compatibility matrix.
      - name: Run unit tests
        run: python -m pytest tests -m 'not live' -n auto -ra -p no:cacheprovider

  # The oldest versions that pyproject.toml declares, so a floor that no longer works
  # fails here and not on the machine of a user who has that version.
  lowest-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      # uv resolves the lowest version of each direct dependency and the highest of
      # the rest; the test tools are installed afterwards, at their newest.
      - name: Install the lowest declared versions of the dependencies
        run: |
          python -m pip install --disable-pip-version-check uv
          uv venv "$RUNNER_TEMP/lowest"
          uv pip install --python "$RUNNER_TEMP/lowest/bin/python" --resolution lowest-direct -e .
          uv pip install --python "$RUNNER_TEMP/lowest/bin/python" \
            'pytest>=9,<10' 'pytest-xdist>=3.6,<4'
          uv pip list --python "$RUNNER_TEMP/lowest/bin/python"
      - name: Run unit tests
        run: >-
          "$RUNNER_TEMP/lowest/bin/python" -m pytest tests -m 'not live' -n auto -ra -p no:cacheprovider

  # One small build on every PR: changes to shared code can affect the build and
  # publication without touching their own modules. No Biber, extra engines or fonts.
  live-linux-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # This is a disposable runner setting, as in live-linux below.
      - name: Allow unprivileged user namespaces on this runner
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install the minimal TeX and PDF toolchain and Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap latexmk texlive-latex-base poppler-utils
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      - name: Prepare and rebuild the submission ZIP under Bubblewrap
        env:
          FLEDGE_RUN_INTEGRATION: "1"
          FLEDGE_TEST_ARTIFACT_DIR: ${{ runner.temp }}/fledge-test-reports
        run: python -m pytest tests/test_live_linux_smoke.py -m live -v -ra -p no:cacheprovider
      - name: Keep the report if the smoke fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-linux-smoke-failing-report
          path: ${{ runner.temp }}/fledge-test-reports
          if-no-files-found: ignore
          retention-days: 14

  live-macos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    continue-on-error: false
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install TeX and PDF tools
        run: |
          brew install --cask basictex
          brew install poppler tex-fmt qpdf mupdf-tools
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      # cm-super provides the Type 1 versions of the Computer Modern text fonts.
      # Without it, LaTeX's default list bullet, \S and \$ need a bitmap font,
      # and builds never generate those, so they stop with "Font ... not found".
      # The engine tests also need TeX Gyre (fontspec), glossaries with its
      # dependencies, nomencl, and bbm, whose fonts exist only as METAFONT sources.
      - name: Install TeX packages
        run: |
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install latexmk biber biblatex hyperref \
            import subfiles embedfile cm-super tex-gyre glossaries mfirstuc \
            tracklang xfor nomencl bbm-macros bbm chktex
      - name: Show tool versions
        run: |
          latexmk -v | head -n 2
          pdflatex --version | head -n 1
          biber --version
          pdfinfo -v
          qpdf --version | head -n 1
          mutool -v
          tex-fmt --version
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      # Serial on purpose: these tests run real TeX, Biber and Seatbelt and
      # check timing and process-group cleanup, so they should not compete
      # with each other for CPU on the hosted runner.
      - name: Run live integration and sandbox tests
        env:
          FLEDGE_RUN_INTEGRATION: "1"
          # The live tests write the JSON report of every failing outcome here.
          FLEDGE_TEST_ARTIFACT_DIR: ${{ runner.temp }}/fledge-test-reports
        run: python -m pytest tests -m live -v -ra --durations=25 -p no:cacheprovider
      - name: Keep the reports of failing live tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-macos-failing-reports
          path: ${{ runner.temp }}/fledge-test-reports
          if-no-files-found: ignore
          retention-days: 14

  # Live Linux tests: real builds under the Bubblewrap sandbox on a GitHub-hosted
  # Ubuntu runner, weekly and on manual dispatch, with two TeX Live installations so that
  # an effect of the TeX Live version does not pass for an effect of the platform:
  #   - `ubuntu-packages`: TeX Live 2023 from apt, with Biber and Poppler. The job first
  #     passed in this form on 2026-10-12, and what the documentation says about Linux
  #     rests on it.
  #   - `current-from-tug`: the current TeX Live release, installed from tug.org (a small
  #     scheme plus the packages the tests need, without documentation and sources) under
  #     /usr/local/texlive, which the Linux sandbox accepts as a system prefix.
  # The runner is pinned to the Ubuntu release the documentation names. A failure here is
  # a real result, so the job is not allowed to fail silently (no continue-on-error).
  live-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: false
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        texlive: [ubuntu-packages, current-from-tug]
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CI RUNNER SETTING, not part of Fledge. Ubuntu 24.04 can restrict
      # unprivileged user namespaces with AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), and Bubblewrap needs them.
      # Fledge never builds without its sandbox and has no unsandboxed fallback, so
      # on such a host builds are blocked until user namespaces are allowed. This
      # disposable runner is relaxed so the sandbox itself can be tested. On your
      # own host, decide deliberately: relax the setting system-wide, or add an
      # AppArmor profile that lets /usr/bin/bwrap create user namespaces.
      - name: Allow unprivileged user namespaces on this runner
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns is absent; nothing to relax."
          fi
      # qpdf and MuPDF's mutool are optional; the live PDF tool tests need them.
      - name: Install Bubblewrap, Poppler, qpdf and MuPDF
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap poppler-utils qpdf mupdf-tools
      # Debian-layout TeX Live packages: the Linux sandbox grants only system
      # prefixes such as /usr/share/texlive and /var/lib/texmf (see
      # _LINUX_SYSTEM_RESOURCES in src/latexprep/sandbox.py). The latex-recommended
      # package carries etoolbox, which biblatex needs; bibtex-extra carries
      # biblatex itself, and latex-extra the import, subfiles and embedfile packages
      # that the live source and engine tests use. The engines xelatex and lualatex
      # come from their packages, cm-super the Type 1 text fonts that default list
      # bullets need, because builds never generate bitmap fonts, and tex-gyre the
      # OpenType fonts of the fontspec test.
      - name: Install TeX Live, Biber and latexmk from Ubuntu
        if: ${{ matrix.texlive == 'ubuntu-packages' }}
        run: |
          sudo apt-get install --yes --no-install-recommends \
            latexmk biber \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-bibtex-extra texlive-latex-extra texlive-xetex texlive-luatex \
            cm-super tex-gyre chktex
      # A small scheme plus the packages the live tests need: those of the macOS job, the
      # XeTeX and LuaTeX engines, and what the Ubuntu leg gets from its apt packages
      # (recommended LaTeX and font packages, bibtex-extra). That is about 280 MB to
      # download, where scheme-full is about 1.7 GB (compressed, without documentation) and
      # installs slowly on a hosted runner. Documentation and source files are left out. The release is whichever one
      # tug.org serves now, which is the point of this leg; it installs under
      # /usr/local/texlive/<year>.
      # Nothing from the installer is unpacked or run before it is verified, in this order:
      #   1. The TeX Live public key is fetched from tug.org itself, not from the mirror and
      #      not from the unverified installer, into an empty keyring of this step.
      #   2. The signature of the hash file (install-tl-unx.tar.gz.sha512.asc) must verify
      #      with that keyring, and gpg's VALIDSIG line must name TEXLIVE_SIGNING_KEY as the
      #      primary key. The pin is what authenticates the hash: a key from a substituted
      #      texlive.asc cannot produce such a signature without the TeX Live private key.
      #   3. The installer must match the signed SHA-512; only then is it unpacked and run.
      # TEXLIVE_SIGNING_KEY pins the fingerprint of the primary key; tug.org renews the
      # signing subkey every year, so the subkey is not pinned. The fingerprint was taken
      # from the keyring and from tlpkg/gpg/tl-key-extension.txt of the installer on
      # 2026-11-13, so the pin guards against a later substitution of the installer or its
      # key, not against a bad first observation; compare it with the key that tug.org
      # publishes if it ever has to change. Nothing guards against an older, validly signed
      # installer being served.
      # The step has its own timeout, so a slow mirror fails here and not at the job's limit.
      - name: Install the current TeX Live from tug.org
        if: ${{ matrix.texlive == 'current-from-tug' }}
        timeout-minutes: 25
        env:
          TEXLIVE_SIGNING_KEY: C78B82D8C79512F79CC0D7C80D5E5D9106BAB6BC
          TEXLIVE_PUBLIC_KEY_URL: https://tug.org/texlive/files/texlive.asc
        run: |
          set -euo pipefail
          installer="$(mktemp -d)"
          mirror="$(curl --fail --silent --show-error --location --output /dev/null \
            --write-out '%{url_effective}' https://mirror.ctan.org/systems/texlive/tlnet/)"
          echo "Using the mirror $mirror"
          for name in install-tl-unx.tar.gz install-tl-unx.tar.gz.sha512 \
            install-tl-unx.tar.gz.sha512.asc; do
            curl --fail --silent --show-error --location --retry 3 \
              --output "$installer/$name" "${mirror}${name}"
          done
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --proto-redir '=https' \
            --output "$installer/texlive.asc" "$TEXLIVE_PUBLIC_KEY_URL"
          cd "$installer"
          export GNUPGHOME="$installer/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --quiet --import texlive.asc
          if ! status="$(gpg --batch --status-fd 1 \
            --verify install-tl-unx.tar.gz.sha512.asc install-tl-unx.tar.gz.sha512 2>/dev/null)" \
            || ! grep -Eq "^\[GNUPG:\] VALIDSIG .* ${TEXLIVE_SIGNING_KEY}\$" <<< "$status"; then
            echo "::error::The hash of the TeX Live installer is not signed by the TeX Live signing key."
            exit 1
          fi
          sha512sum --check --strict install-tl-unx.tar.gz.sha512
          mkdir unpacked
          tar -xzf install-tl-unx.tar.gz -C unpacked --strip-components=1
          cat > texlive.profile <<'PROFILE'
          selected_scheme scheme-small
          instopt_adjustpath 0
          tlpdbopt_autobackup 0
          tlpdbopt_desktop_integration 0
          tlpdbopt_file_assocs 0
          tlpdbopt_install_docfiles 0
          tlpdbopt_install_srcfiles 0
          PROFILE
          sudo perl unpacked/install-tl --no-interaction --repository "$mirror" \
            --profile texlive.profile
          bin_directory="$(echo /usr/local/texlive/*/bin/x86_64-linux)"
          sudo env "PATH=$bin_directory:$PATH" tlmgr --repository "$mirror" install \
            collection-latexrecommended collection-fontsrecommended collection-bibtexextra \
            collection-xetex collection-luatex \
            latexmk biber biblatex hyperref import subfiles embedfile cm-super tex-gyre \
            glossaries mfirstuc tracklang xfor nomencl bbm-macros bbm chktex
          test -x "$bin_directory/pdflatex"
          echo "$bin_directory" >> "$GITHUB_PATH"
      # Ubuntu does not package tex-fmt, but the formatting step of the live
      # preparation test needs it, and the sandbox accepts only tools under /usr.
      # Install a pinned release binary, verified against its SHA-256, into
      # /usr/local/bin.
      - name: Install tex-fmt
        env:
          TEX_FMT_VERSION: v0.5.7
          TEX_FMT_SHA256: d0e30b9b811fdc1e66a9328d5c95e9d8e585019288ca39c07f643e0796bcc4a3
        run: |
          archive="$RUNNER_TEMP/tex-fmt.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/WGUNDERWOOD/tex-fmt/releases/download/${TEX_FMT_VERSION}/tex-fmt-x86_64-linux.tar.gz"
          echo "${TEX_FMT_SHA256}  ${archive}" | sha256sum --check --strict -
          extract="$(mktemp -d)"
          tar -xzf "$archive" -C "$extract" tex-fmt
          sudo install -m 0755 "$extract/tex-fmt" /usr/local/bin/tex-fmt
      - name: Show tool versions
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, kernel $(uname -r)"
          bwrap --version
          latexmk -v | head -n 2
          pdflatex --version | head -n 1
          xelatex --version | head -n 1
          lualatex --version | head -n 1
          biber --version
          pdfinfo -v
          qpdf --version | head -n 1
          mutool -v
          tex-fmt --version
          command -v pdflatex
      # Start Bubblewrap with the namespaces and capability drop Fledge requires,
      # before any test runs, so a kernel or AppArmor refusal is reported as such
      # and not as many failed builds.
      - name: Check that Bubblewrap can start
        run: |
          if ! bwrap --unshare-user --unshare-ipc --unshare-pid --unshare-net \
            --unshare-uts --unshare-cgroup --disable-userns --cap-drop ALL \
            --new-session --die-with-parent --ro-bind / / --proc /proc --dev /dev \
            -- /usr/bin/true; then
            echo "::error::Bubblewrap cannot start with the namespaces Fledge requires on this runner (user namespaces, AppArmor or kernel policy)."
            exit 1
          fi
          echo "Bubblewrap started with the full Fledge namespace set."
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      # Serial, as on macOS. The live marker selects the suite and each platform gate
      # stays with its test, so new live cases are discovered without editing CI.
      - name: Run live integration tests
        env:
          FLEDGE_RUN_INTEGRATION: "1"
          # The live tests write the JSON report of every failing outcome here.
          FLEDGE_TEST_ARTIFACT_DIR: ${{ runner.temp }}/fledge-test-reports
        run: python -m pytest tests -m live -v -ra --durations=25 -p no:cacheprovider
      - name: Keep the reports of failing live tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: live-linux-${{ matrix.texlive }}-failing-reports
          path: ${{ runner.temp }}/fledge-test-reports
          if-no-files-found: ignore
          retention-days: 14

  # A failed weekly run notifies nobody by itself: GitHub mails only the person who last
  # edited the cron line. This job opens an issue, or comments on the open one, so the
  # maintainers are notified. It is the only job with `issues: write`, and it checks out no
  # code. Close the issue once the cause is fixed; the next failure opens a new one.
  # The PR-only smoke is omitted here; live-linux covers it on the schedule.
  alert-on-scheduled-failure:
    if: ${{ !cancelled() && github.event_name == 'schedule' && contains(needs.*.result, 'failure') }}
    needs:
      - quality
      - shellcheck
      - package
      - unit
      - lowest-dependencies
      - live-macos
      - live-linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue about the failed scheduled run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="Scheduled CI run failed"
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure") | "- `" + .key + "`"' <<< "$NEEDS")"
          body="$(printf 'The scheduled run of the Tests workflow failed.\n\nFailed jobs:\n%s\n\nRun: %s\n' "$failed" "$RUN_URL")"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\")][0].number // empty")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
