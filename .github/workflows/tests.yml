name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so live TeX and sandbox tests notice upstream drift between pushes.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests docs/conf.py scripts
      - name: Check formatting
        run: ruff format --check src tests docs/conf.py scripts
      - name: Check types
        run: ty check src/latexprep

  # Shell scripts are linted here because the installer is the one shell program shipped.
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # shellcheck is preinstalled on GitHub-hosted Ubuntu runners.
      - name: Lint install.sh
        run: |
          shellcheck --version
          shellcheck install.sh

  # The same strict build as the Deploy documentation workflow, without publishing,
  # so a broken link or reference fails the pull request and not the merge.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install documentation dependencies
        run: python -m pip install '.[docs]'
      - name: Build documentation with warnings as errors
        run: >-
          python -m sphinx -n -W --keep-going -b html
          -d "$RUNNER_TEMP/sphinx-doctrees" docs "$RUNNER_TEMP/docs-html"

  # Build what would be published and use it the way a user would: install the wheel
  # into a fresh environment and run it from another directory, then run the
  # documentation and packaging tests from the extracted source archive, which must carry
  # every file they read (scripts, skills, examples, docs and the changelog).
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check the package metadata and version
        run: python scripts/release_checks.py version
      - name: Build source distribution and wheel
        run: |
          python -m pip install --disable-pip-version-check 'build>=1.2,<2' 'twine>=6,<7'
          python -m build --outdir dist
          python -m twine check --strict dist/*
      - name: Install the wheel in a fresh environment and run fledge --version
        run: python scripts/release_checks.py wheel dist
      - name: Run the documentation and packaging tests from the source distribution
        run: |
          extract="$(mktemp -d)"
          tar -xzf dist/*.tar.gz -C "$extract"
          cd "$extract"/*/
          python -m venv "$RUNNER_TEMP/sdist-tests"
          "$RUNNER_TEMP/sdist-tests/bin/python" -m pip install --disable-pip-version-check \
            . 'pytest>=9,<10'
          "$RUNNER_TEMP/sdist-tests/bin/python" -m pytest tests/test_docs.py tests/test_packaging.py \
            -q -p no:cacheprovider

  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      # Tests that need TeX, Poppler or a live sandbox skip unless their
      # opt-in variables are set; the live-macos job sets them.
      # pytest replaces `python -m unittest discover`: it collects the same
      # unittest.TestCase tests, reports each failing subTest, and pytest-xdist
      # spreads them over one worker process per CPU. `-ra` (also set in
      # pyproject.toml) summarises every failure, error and skip reason.
      - name: Run unit tests
        run: python -m pytest tests -n auto -ra -p no:cacheprovider

  live-macos:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: macos-latest
    continue-on-error: false
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install TeX and PDF tools
        run: |
          brew install --cask basictex
          brew install poppler tex-fmt
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
      - name: Install TeX packages
        run: |
          sudo /Library/TeX/texbin/tlmgr update --self
          sudo /Library/TeX/texbin/tlmgr install latexmk biber biblatex hyperref
      - name: Show tool versions
        run: |
          latexmk -v | head -n 2
          pdflatex --version | head -n 1
          biber --version
          pdfinfo -v
          tex-fmt --version
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      # Serial on purpose: these tests run real TeX, Biber and Seatbelt and
      # check timing and process-group cleanup, so they should not compete
      # with each other for CPU on the hosted runner.
      - name: Run live integration and sandbox tests
        env:
          FLEDGE_RUN_INTEGRATION: "1"
        run: >-
          python -m pytest
          tests/test_integration.py
          tests/test_integration_checks.py
          tests/test_integration_packages.py
          tests/test_integration_backends.py
          tests/test_loaded_options.py
          tests/test_pdf.py
          tests/test_pdf_checks.py
          tests/test_runtime_inputs.py
          tests/test_runtime_monitoring.py
          -v -ra -p no:cacheprovider

  # Live Linux tests: real builds under the Bubblewrap sandbox on a GitHub-hosted
  # Ubuntu runner, with TeX Live, Biber and Poppler from apt, weekly and on manual
  # dispatch. The job first passed on 2026-10-12, and what the documentation says
  # about Linux rests on it; the runner is pinned to the Ubuntu release the
  # documentation names. A failure here is a real result, so the job is not
  # allowed to fail silently (no continue-on-error).
  live-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    continue-on-error: false
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CI RUNNER SETTING, not part of Fledge. Ubuntu 24.04 can restrict
      # unprivileged user namespaces with AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), and Bubblewrap needs them.
      # Fledge never builds without its sandbox and has no unsandboxed fallback, so
      # on such a host builds are blocked until user namespaces are allowed. This
      # disposable runner is relaxed so the sandbox itself can be tested. On your
      # own host, decide deliberately: relax the setting system-wide, or add an
      # AppArmor profile that lets /usr/bin/bwrap create user namespaces.
      - name: Allow unprivileged user namespaces on this runner
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          else
            echo "kernel.apparmor_restrict_unprivileged_userns is absent; nothing to relax."
          fi
      # Debian-layout TeX Live packages: the Linux sandbox grants only system
      # prefixes such as /usr/share/texlive and /var/lib/texmf (see
      # _LINUX_SYSTEM_RESOURCES in src/latexprep/runtime.py). The latex-recommended
      # package carries etoolbox, which biblatex needs; bibtex-extra carries
      # biblatex itself. The engines xelatex and lualatex come from their packages.
      - name: Install TeX, PDF tools and Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap latexmk biber poppler-utils \
            texlive-latex-base texlive-latex-recommended texlive-fonts-recommended \
            texlive-bibtex-extra texlive-xetex texlive-luatex
      # Ubuntu does not package tex-fmt, but the formatting step of the live
      # preparation test needs it, and the sandbox accepts only tools under /usr.
      # Install a pinned release binary, verified against its SHA-256, into
      # /usr/local/bin.
      - name: Install tex-fmt
        env:
          TEX_FMT_VERSION: v0.5.7
          TEX_FMT_SHA256: d0e30b9b811fdc1e66a9328d5c95e9d8e585019288ca39c07f643e0796bcc4a3
        run: |
          archive="$RUNNER_TEMP/tex-fmt.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/WGUNDERWOOD/tex-fmt/releases/download/${TEX_FMT_VERSION}/tex-fmt-x86_64-linux.tar.gz"
          echo "${TEX_FMT_SHA256}  ${archive}" | sha256sum --check --strict -
          extract="$(mktemp -d)"
          tar -xzf "$archive" -C "$extract" tex-fmt
          sudo install -m 0755 "$extract/tex-fmt" /usr/local/bin/tex-fmt
      - name: Show tool versions
        run: |
          . /etc/os-release && echo "$PRETTY_NAME, kernel $(uname -r)"
          bwrap --version
          latexmk -v | head -n 2
          pdflatex --version | head -n 1
          xelatex --version | head -n 1
          lualatex --version | head -n 1
          biber --version
          pdfinfo -v
          tex-fmt --version
      # Start Bubblewrap with the namespaces and capability drop Fledge requires,
      # before any test runs, so a kernel or AppArmor refusal is reported as such
      # and not as many failed builds.
      - name: Check that Bubblewrap can start
        run: |
          if ! bwrap --unshare-user --unshare-ipc --unshare-pid --unshare-net \
            --unshare-uts --unshare-cgroup --disable-userns --cap-drop ALL \
            --new-session --die-with-parent --ro-bind / / --proc /proc --dev /dev \
            -- /usr/bin/true; then
            echo "::error::Bubblewrap cannot start with the namespaces Fledge requires on this runner (user namespaces, AppArmor or kernel policy)."
            exit 1
          fi
          echo "Bubblewrap started with the full Fledge namespace set."
      - name: Install package and test tools
        run: python -m pip install -e '.[dev]'
      # Serial on purpose, as in live-macos. The live tests in
      # test_runtime_inputs.py and test_runtime_monitoring.py run only on macOS, so those
      # files are left out.
      # test_integration_realistic.py is added here because it covers
      # ordinary-paper constructs and Biber, and test_runtime_backends.py because
      # it holds the live Bubblewrap isolation test. A packaging test fails when a
      # test file with live tests is missing from the live jobs.
      - name: Run live integration tests
        env:
          FLEDGE_RUN_INTEGRATION: "1"
        run: >-
          python -m pytest
          tests/test_integration.py
          tests/test_integration_checks.py
          tests/test_integration_packages.py
          tests/test_integration_backends.py
          tests/test_integration_realistic.py
          tests/test_loaded_options.py
          tests/test_pdf.py
          tests/test_pdf_checks.py
          tests/test_runtime_backends.py
          -v -ra -p no:cacheprovider
