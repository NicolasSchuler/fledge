name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "scripts/**"
      - "skills/**"
      - "README.md"
      - "architecture.md"
      - "requirements.md"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "install.sh"
  workflow_dispatch:

permissions: {}

# Let an active publication finish before starting the latest queued run.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Install documentation dependencies
        run: python -m pip install '.[docs]'
      - name: Build documentation with warnings as errors
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: >-
          python -m sphinx -n -W --keep-going -b html
          -d "$RUNNER_TEMP/sphinx-doctrees"
          -D html_baseurl="$PAGES_BASE_URL/"
          docs docs/_build/html
      - name: Upload documentation
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
