[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fledge"
version = "0.1.0"
description = "Fledge prepares verified LaTeX submission bundles without changing the original project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "rich>=13.7,<15"]

[project.urls]
Repository = "https://github.com/NicolasSchuler/fledge"

[project.optional-dependencies]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6"]
build = ["build>=1.2,<2"]
dev = ["ruff>=0.9,<1", "ty>=0.0.1,<0.1"]

[project.scripts]
fledge = "latexprep.cli:main"
latex-prep = "latexprep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["latexprep*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
