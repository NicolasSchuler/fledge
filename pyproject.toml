[build-system]
# 77 reads the SPDX license expression and license-files below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fledge-latex"
# The version is defined once, as latexprep.__version__; setuptools reads it without importing.
dynamic = ["version"]
description = "Fledge prepares verified LaTeX submission bundles without changing the original project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Schuler" }]
keywords = ["latex", "submission", "arxiv", "reproducibility", "pdf", "bibliography", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "rich>=13.7,<15"]

[project.urls]
Repository = "https://github.com/NicolasSchuler/fledge"
Documentation = "https://nicolasschuler.github.io/fledge/"
Issues = "https://github.com/NicolasSchuler/fledge/issues"
Changelog = "https://github.com/NicolasSchuler/fledge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6"]
build = ["build>=1.2,<2"]
# pytest 9 reports unittest subTest failures individually; xdist runs the suite in parallel.
dev = ["ruff>=0.9,<1", "ty>=0.0.1,<0.1", "pytest>=9,<10", "pytest-xdist>=3.6,<4"]

[project.scripts]
fledge = "latexprep.cli:main"
latex-prep = "latexprep.cli:main"

[tool.setuptools.dynamic]
version = { attr = "latexprep.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["latexprep*"]
namespaces = false

[tool.setuptools.package-data]
# Example presets, the loaded-options TeX hook and the HTML report stylesheet are read
# through importlib.resources; tests fail if they do not ship.
latexprep = ["presets/*.toml", "loaded_options_hook.tex", "report.css"]

[tool.pytest.ini_options]
# The tests are unittest.TestCase classes; pytest collects exactly the same tests as
# `python -m unittest discover -s tests -t .` and adds parallel runs with pytest-xdist.
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = [
    "live: drives real TeX, Poppler, Biber or sandbox tools; opt in with FLEDGE_RUN_INTEGRATION=1",
]
xfail_strict = true
# Dump every thread's traceback when a single test runs this long, so a hung test
# names itself in CI logs instead of silently consuming the job timeout.
faulthandler_timeout = 300

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B",
    # Style and simplification rules with real signal.
    "C4", "PIE", "PERF", "PTH", "SIM", "RUF", "PGH", "T20",
    # Every blind `except Exception` must be a justified boundary that reports its cause.
    "BLE",
    # Boolean flags are keyword-only. FBT003 (a positional True or False in a call) is left
    # out: its 16 hits fill positional fields of private NamedTuples and dataclasses, and
    # one stdlib call (`setblocking`), where the value is the data.
    "FBT001", "FBT002",
    # Unused arguments, apart from interface implementations (see the ignores below).
    "ARG",
    # Logging: lazy %-formatting, `getLogger(__name__)` and no stray root-logger calls.
    "G", "LOG",
    # Complexity ceilings that keep functions small.
    "C901", "PLR0912", "PLR0913", "PLR0915",
]
ignore = [
    # The ambiguous characters in strings are intentional: typographic dashes, quotes, the
    # multiplication sign and Greek letters that the text checks recognise or produce for
    # the user. RUF002 and RUF003 (docstrings and comments) stay enabled.
    "RUF001",
    # `"a b c".split()` keeps the long word and name tables readable.
    "SIM905",
]

# Decompose a function rather than raising a ceiling or adding an ignore.
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-statements = 50

[tool.ruff.lint.per-file-ignores]
# Implementations of the sandbox backend and process table interfaces take every argument
# of the interface even when one backend ignores some of them.
"src/latexprep/sandbox.py" = ["ARG002"]
"src/latexprep/process_table.py" = ["ARG002"]
# Command-line scripts report through print.
"scripts/*" = ["T201"]
# Test doubles mirror the signatures they replace, so their unused arguments are intended.
# `with` blocks nest in unittest (`subTest` inside `assertRaises`), and a few tests catch
# BaseException on purpose to record what escaped a thread or a cancelled task.
"tests/*" = ["ARG", "SIM117", "C408", "BLE001"]
# A fixture builder with a keyword for every build field.
"tests/support.py" = ["PLR0913"]
# Long live scenarios and a harness that mimics a whole build.
"tests/test_integration_checks.py" = ["C901", "PLR0915"]
"tests/test_loaded_options.py" = ["C901", "PLR0912"]
"tests/test_scheduler_resources.py" = ["PLR0915"]
