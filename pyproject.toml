[build-system]
# 77 reads the SPDX license expression and license-files below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fledge-latex"
# The version is defined once, as latexprep.__version__; setuptools reads it without importing.
dynamic = ["version"]
description = "Fledge prepares verified LaTeX submission bundles without changing the original project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicolas Schuler" }]
keywords = ["latex", "submission", "arxiv", "reproducibility", "pdf", "bibliography", "linter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "rich>=13.7,<15"]

[project.urls]
Repository = "https://github.com/NicolasSchuler/fledge"
Documentation = "https://nicolasschuler.github.io/fledge/"
Issues = "https://github.com/NicolasSchuler/fledge/issues"
Changelog = "https://github.com/NicolasSchuler/fledge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6"]
build = ["build>=1.2,<2"]
# pytest 9 reports unittest subTest failures individually; xdist runs the suite in parallel.
dev = ["ruff>=0.9,<1", "ty>=0.0.1,<0.1", "pytest>=9,<10", "pytest-xdist>=3.6,<4"]

[project.scripts]
fledge = "latexprep.cli:main"
latex-prep = "latexprep.cli:main"

[tool.setuptools.dynamic]
version = { attr = "latexprep.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["latexprep*"]
namespaces = false

[tool.setuptools.package-data]
# Example presets, the loaded-options TeX hook and the HTML report stylesheet are read
# through importlib.resources; tests fail if they do not ship.
latexprep = ["presets/*.toml", "loaded_options_hook.tex", "report.css"]

[tool.pytest.ini_options]
# The tests are unittest.TestCase classes; pytest collects exactly the same tests as
# `python -m unittest discover -s tests -t .` and adds parallel runs with pytest-xdist.
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
# Dump every thread's traceback when a single test runs this long, so a hung test
# names itself in CI logs instead of silently consuming the job timeout.
faulthandler_timeout = 300

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0912", "PLR0913", "PLR0915"]

# Ceilings that keep functions small. The few per-file ignores below name the test files
# that still exceed them; decompose a function rather than adding an ignore.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 60

[tool.ruff.lint.per-file-ignores]
# A fixture builder with a keyword for every build field, and one long live scenario.
"tests/support.py" = ["PLR0913"]
"tests/test_integration_checks.py" = ["PLR0915"]
