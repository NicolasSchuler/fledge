[build-system]
# 77 reads the SPDX license expression and license-files below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fledge-latex"
version = "0.2.0"
description = "Fledge prepares verified LaTeX submission bundles without changing the original project"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["click>=8.1,<9", "rich>=13.7,<15"]

[project.urls]
Repository = "https://github.com/NicolasSchuler/fledge"
Documentation = "https://nicolasschuler.github.io/fledge/"

[project.optional-dependencies]
docs = ["sphinx>=8,<10", "myst-parser>=4,<6"]
build = ["build>=1.2,<2"]
# pytest 9 reports unittest subTest failures individually; xdist runs the suite in parallel.
dev = ["ruff>=0.9,<1", "ty>=0.0.1,<0.1", "pytest>=9,<10", "pytest-xdist>=3.6,<4"]

[project.scripts]
fledge = "latexprep.cli:main"
latex-prep = "latexprep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["latexprep*"]
namespaces = false

[tool.setuptools.package-data]
# Example presets and the loaded-options TeX hook are read through importlib.resources;
# tests fail if they do not ship.
latexprep = ["presets/*.toml", "loaded_options_hook.tex"]

[tool.pytest.ini_options]
# The tests are unittest.TestCase classes; pytest collects exactly the same tests as
# `python -m unittest discover -s tests -t .` and adds parallel runs with pytest-xdist.
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
# Dump every thread's traceback when a single test runs this long, so a hung test
# names itself in CI logs instead of silently consuming the job timeout.
faulthandler_timeout = 300

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C901", "PLR0912", "PLR0913", "PLR0915"]

# Ceilings that keep new functions small. The per-file ignores below name the
# files whose functions still exceed them; decompose those rather than adding more.
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 20
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/latexprep/author_records.py" = ["PLR0915"]
"src/latexprep/build_dependencies.py" = ["C901", "PLR0912", "PLR0913", "PLR0915"]
"src/latexprep/core.py" = ["PLR0913"]
"src/latexprep/doctor.py" = ["PLR0915"]
"src/latexprep/metadata_privacy.py" = ["C901"]
"src/latexprep/online_checks.py" = ["C901", "PLR0912", "PLR0915"]
"src/latexprep/package_inventory.py" = ["C901", "PLR0912", "PLR0915"]
"src/latexprep/pdf_artwork.py" = ["C901"]
"src/latexprep/pdf_checks.py" = ["C901", "PLR0912"]
"src/latexprep/pdf_structure_checks.py" = ["C901", "PLR0912", "PLR0915"]
"src/latexprep/source_graph.py" = ["C901", "PLR0912", "PLR0915"]
"src/latexprep/source_transform.py" = ["PLR0915"]
"src/latexprep/terminal_report.py" = ["PLR0912"]
"src/latexprep/tex_lexer.py" = ["PLR0915"]
